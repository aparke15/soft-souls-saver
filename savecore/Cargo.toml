[package]
name = "savecore"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
camino = "1.2.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = "6.0.0"
glob = "0.3.3"
hex = "0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
shellexpand = "3.1.2"
sysinfo = { version = "0.30", features = ["multithread"] }
thiserror = "2.0.18"
walkdir = "2.5.0"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
